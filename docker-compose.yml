services:
  nextjs:
    container_name: btalents
    restart: always
    # Charge les variables pour Docker Compose lui-même
    env_file:
      - .env.production
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Transmet la variable au moment du build (pour pnpm build / prisma generate)
        - DATABASE_URL=${DATABASE_URL}
    # Transmet les variables au conteneur au moment de l'exécution (RUNTIME)
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_BASE_URL=${BETTER_AUTH_BASE_URL}
      - NODE_ENV=production
    ports:
      - "3005:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Utilisation de pnpm pour lancer la migration avant de démarrer le serveur
    command: >
      sh -c "pnpm prisma migrate deploy && node server.js"
