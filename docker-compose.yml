# Avec sudo, utiliser un chemin absolu pour que le conteneur reçoive bien les variables :
#   sudo BTALENTS_ENV=/home/admin_marabu/apps/btalents/.env.production docker compose --env-file .env.production up -d --build
services:
  nextjs:
    container_name: btalents
    restart: always
    env_file:
      - ${BTALENTS_ENV:-.env.production}
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - BETTER_AUTH_BASE_URL=${BETTER_AUTH_BASE_URL:-}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DATABASE_URL=${DATABASE_URL:-}
    ports:
      - "3005:3005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "pnpm prisma migrate deploy && node server.js"
